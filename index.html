<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>🐥 변덕님 오깅이 뽑기 대회 💛</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff5d9,#ffe4ee);color:#78566c;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;text-align:center}.wrap{max-width:510px;margin:auto;padding:16px 12px 36px}h1{font-size:clamp(21px,5.4vw,27px);margin:8px 0 6px}p{font-size:14px;margin:0 0 15px}canvas{display:block;width:100%;height:auto;background:#fce7ed;border-radius:22px;box-shadow:0 8px 26px #b97c9744;touch-action:none}.controls{display:flex;gap:10px;margin:14px 0}.controls button{border:0;border-radius:18px;background:#fff;color:#a66b8c;font-size:24px;font-weight:800;height:72px;flex:1;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px #dfb7c8}.controls #grab{flex:2.6;background:#f4a5be;color:#fff;font-size:19px;box-shadow:0 5px #d47d9f}.controls button:disabled{opacity:.55}.msg{padding:12px 8px;border-radius:14px;background:#ffffffb8;font-size:14px;min-height:46px}.count{font-size:14px;margin:12px}.reset{padding:10px 20px;border:1px solid #d79fb6;background:#fff8;color:#9b6985;border-radius:14px}.hint{font-size:12px;opacity:.8;margin-top:12px}.result{position:fixed;inset:0;background:#392336a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.result.show{display:flex}.panel{width:min(360px,100%);border:5px solid #f3aec9;border-radius:25px;background:#fff9ef;padding:23px 16px;box-shadow:0 18px 45px #38223355;animation:pop .25s ease-out}.result-title{font-size:29px;font-weight:900;color:#b75b88}.result-detail{font-size:19px;font-weight:700;margin:12px 0}.prize-photo{display:none;max-height:220px;max-width:82%;object-fit:contain;margin:12px auto}.prize-photo.visible{display:block}.actions{display:flex;gap:9px;justify-content:center}.actions button{flex:1;min-height:49px;border:0;border-radius:13px;font-size:16px;font-weight:800}.again{background:#ee9dbb;color:white}.cancel{background:#eee5e9;color:#79586c}@keyframes pop{from{transform:scale(.86);opacity:.5}to{transform:scale(1);opacity:1}}</style></head><body>
<main class="wrap"><h1>🐥 변덕님 오깅이 뽑기 대회 💛</h1><p>복슬변덕과 민둥변덕을 뽑아보세요!</p><canvas id="game" width="420" height="540" aria-label="인형뽑기 게임"></canvas><div class="controls"><button id="left" aria-label="왼쪽으로 이동">◀</button><button id="grab">🕹️ 뽑기!</button><button id="right" aria-label="오른쪽으로 이동">▶</button></div><div class="msg" id="msg" aria-live="polite">원하는 인형 위로 집게를 이동해 보세요! 💛</div><div class="count" id="count">도전 0회 · 성공 0개</div><button class="reset" id="reset">인형 다시 채우기 ↻</button><div class="hint">인형을 겨냥해 뽑기를 누르세요. 출구 안에 들어가야 획득 성공!</div></main>
<div class="result" id="result" role="dialog" aria-modal="true"><div class="panel"><div class="result-title" id="resultTitle"></div><img id="prizePhoto" class="prize-photo" alt="획득한 인형"><div class="result-detail" id="resultDetail"></div><div class="actions"><button class="again" id="again">한 번 더 뽑기 🐥</button><button class="cancel" id="cancel">닫기</button></div></div></div>
<script>
(function(){'use strict';
const canvas=document.getElementById('game'),g=canvas.getContext('2d');const msg=document.getElementById('msg'),counter=document.getElementById('count'),grab=document.getElementById('grab'),overlay=document.getElementById('result');const images=[new Image(),new Image()];images[0].src='fluffy.png';images[1].src='smooth.png';
let prizes=[],x=210,move=0,rope=46,phase='idle',phaseTime=0,attempts=0,wins=0,held=null,falling=null,dropLimit=140,selected=null,dropAt=0,willDrop=false,delivered=null,last=0,queuedX=null,missReason='',swing=0,releaseX=0,releaseY=0,releaseVelocity=0,landed=false;
const names=['복슬변덕','민둥변덕'];
function round(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function duck(p,scale=1){const im=images[p.type];if(!im.complete||!im.naturalWidth)return;const h=59*scale,w=h*im.width/im.height;g.save();g.translate(p.x,p.y);g.rotate(p.angle||0);g.drawImage(im,-w/2,-h*.83,w,h);g.restore()}
function refill(){prizes=[]; // Keep the left prize chute unobstructed while mixing both plush types
for(let row=0;row<3;row++)for(let col=0;col<5;col++){let xx=169+col*46+(row%2?3:0),yy=390-row*43+(col%2)*3;prizes.push({x:xx,y:yy,type:(row*3+col*7+Math.floor(Math.random()*2))%2,angle:(Math.random()-.5)*.18,alive:true})}x=210;move=0;rope=46;phase='idle';phaseTime=0;held=null;falling=null;delivered=null;selected=null;queuedX=null;missReason='';landed=false;swing=0;grab.disabled=false;overlay.classList.remove('show');msg.textContent='복슬변덕과 민둥변덕이 섞여 있어요! 원하는 인형을 정확히 노려보세요 💛'}
function draw(){const bg=g.createLinearGradient(0,0,0,540);bg.addColorStop(0,'#fff7df');bg.addColorStop(1,'#f9d0e1');g.fillStyle=bg;g.fillRect(0,0,420,540);round(12,12,396,517,25,'#edabc2');round(21,21,378,456,20,'#fff5d8');round(34,76,352,365,13,'#e8f8ff');const glass=g.createLinearGradient(40,78,375,440);glass.addColorStop(0,'#e8f8ff');glass.addColorStop(1,'#f7e4f7');g.fillStyle=glass;g.fillRect(40,80,340,355);round(33,22,354,48,15,'#ffd17b');g.fillStyle='#93637c';g.font='bold 17px sans-serif';g.textAlign='center';g.fillText('BYEONDUCK CLAW MACHINE',210,52);
round(44,398,332,32,6,'#efb7ca');round(49,370,93,47,7,'#a66c8e');round(57,375,77,34,5,'#64455f');g.strokeStyle='#fff3c8';g.lineWidth=3;g.strokeRect(57,375,77,34);prizes.filter(p=>p.alive).sort((a,b)=>a.y-b.y).forEach(p=>duck(p,.90));if(falling)duck(falling,.93);
round(54,88,312,13,6,'#d49daf');round(x-19,89,38,22,5,'#fff5d0');g.strokeStyle='#8d7c8a';g.lineWidth=3;g.beginPath();g.moveTo(x,109);g.lineTo(x,109+rope);g.stroke();const cy=109+rope;g.fillStyle='#d5cdd9';g.beginPath();g.arc(x,cy+10,12,0,Math.PI*2);g.fill();g.strokeStyle='#95889a';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(x-7,cy+13);g.quadraticCurveTo(x-32,cy+27,x-20,cy+46);g.moveTo(x+7,cy+13);g.quadraticCurveTo(x+32,cy+27,x+20,cy+46);g.stroke();if(held)duck({x:x+swing*18,y:cy+58,type:held.type,angle:swing*.36},.82);
round(18,444,384,77,18,'#ffbfd0');round(34,451,122,61,12,'#fff3e4');g.fillStyle='#b17d95';g.font='bold 12px sans-serif';g.fillText('PRIZE OUT',95,470);round(48,478,93,24,8,'#c587a3');if(delivered){duck({x:95,y:499,type:delivered.type,angle:0},.37)}g.fillStyle='#ffffff68';g.fillRect(42,84,8,307);g.strokeStyle='#ffffffaa';g.lineWidth=4;g.strokeRect(40,80,340,355)}
function nearest(){return prizes.filter(p=>p.alive&&Math.abs(p.x-x)<23).sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x)||a.y-b.y)[0]||null}
function start(){if(phase!=='idle'||overlay.classList.contains('show'))return;move=0;selected=nearest();landed=false;swing=0;dropLimit=selected?Math.max(78,Math.min(173,selected.y-109-44)):150;rope=46;phase='down';phaseTime=0;held=null;falling=null;delivered=null;attempts++;missReason="";grab.disabled=true;msg.textContent='집게가 내려가는 중…';updateCount()}
function updateCount(){counter.textContent='도전 '+attempts+'회 · 성공 '+wins+'개'}
function result(ok,type,reason){const title=document.getElementById('resultTitle'),detail=document.getElementById('resultDetail'),photo=document.getElementById('prizePhoto');title.textContent=ok?'🎉 뽑기 성공!':'🥹 뽑기 실패!';detail.textContent=ok?names[type]+' 획득!':reason;photo.classList.toggle('visible',ok);if(ok)photo.src=images[type].src;else photo.removeAttribute('src');overlay.classList.add('show')}
function finish(){const ok=landed&&!!delivered;if(ok){wins++;msg.textContent='🎉 '+names[delivered.type]+' 획득!';result(true,delivered.type,'')}else{const reason=missReason||'출구에 들어가지 못했어요!';msg.textContent=reason;result(false,0,reason)}phase='idle';phaseTime=0;grab.disabled=false;updateCount()}
function releasePrize(midway){if(!held)return;const sx=x+swing*18,sy=109+rope+58;falling={x:sx,y:sy,type:held.type,angle:swing*.36,vy:0,vx:midway?(Math.random()-.5)*1.5:releaseVelocity,forChute:!midway};held=null;if(midway){missReason='앗! 운반 중 인형이 떨어졌어요!';msg.textContent='앗! 운반 중에 떨어졌어요! 😭'}else{msg.textContent='출구로 떨어지는 중…';phase='release_fall';phaseTime=0}}
function tick(dt){phaseTime+=dt;
if(phase==='idle'){if(queuedX!==null){const dx=queuedX-x;if(Math.abs(dx)<2){x=queuedX;queuedX=null}else x+=Math.sign(dx)*Math.min(Math.abs(dx),4*dt)}else x=Math.max(65,Math.min(355,x+move*3.7*dt))}
else if(phase==='down'){rope+=3.1*dt;if(rope>=dropLimit){rope=dropLimit;phase='close';phaseTime=0}}
else if(phase==='close'&&phaseTime>23){if(selected&&selected.alive&&Math.abs(selected.x-x)<19&&Math.random()<.57){held=selected;held.alive=false;willDrop=Math.random()<.52;dropAt=0.15+Math.random()*.7;msg.textContent='잡았어요! 출구까지 버텨야 해요!'}else{held=null;missReason='집게가 인형을 잡지 못했어요!';msg.textContent='앗! 집기에 실패했어요!'}phase='up';phaseTime=0}
else if(phase==='up'){rope-=2.6*dt;swing=Math.sin(phaseTime*.14)*.12;if(held&&willDrop&&dropAt<.32&&rope<dropLimit*(1-dropAt)){releasePrize(true)}if(rope<=46){rope=46;phase='transport';phaseTime=0}}
else if(phase==='transport'){const prev=x;x+=(93-x)*Math.min(.044*dt,1);const velocity=x-prev;swing=Math.sin(phaseTime*.16)*(.18+Math.min(.5,Math.abs(velocity)*.09));if(held&&willDrop&&phaseTime>10&&Math.abs(x-93)<(1-dropAt)*270){releasePrize(true)}if(Math.abs(x-93)<1.3){x=93;phase='align';phaseTime=0;msg.textContent=held?'출구에 도착! 집게를 여는 중…':'빈 집게가 출구로 돌아왔어요…'}}
else if(phase==='align'&&phaseTime>30){if(held){releaseVelocity=swing*1.6;releasePrize(false)}else{phase='settle';phaseTime=0}}
else if(phase==='release_fall'){if(!falling&&phaseTime>12){phase='settle';phaseTime=0}}
else if(phase==='settle'&&phaseTime>24){finish()}
if(falling){falling.vy+=.29*dt;falling.x+=falling.vx*dt;falling.y+=falling.vy*dt;falling.angle+=falling.vx*.012*dt;
if(falling.y>=385){if(falling.forChute&&falling.x>=63&&falling.x<=128){delivered={type:falling.type};landed=true;msg.textContent='출구 안으로 쏙! 🎉';falling=null}else if(falling.y>=399){const fx=Math.max(72,Math.min(348,falling.x));prizes.push({x:Math.max(163,fx),y:391,type:falling.type,angle:falling.angle,alive:true});if(falling.forChute)missReason='출구 가장자리를 빗나갔어요!';falling=null}}}
}
function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;tick(dt);draw();requestAnimationFrame(frame)}
function bindDirection(id,dir){const el=document.getElementById(id);const down=e=>{if(phase!=='idle')return;e.preventDefault();queuedX=null;move=dir;try{el.setPointerCapture(e.pointerId)}catch(_){}},up=()=>{if(move===dir)move=0};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);window.addEventListener('blur',up)}
bindDirection('left',-1);bindDirection('right',1);canvas.addEventListener('pointerdown',e=>{if(phase!=='idle')return;const r=canvas.getBoundingClientRect();queuedX=Math.max(65,Math.min(355,(e.clientX-r.left)*420/r.width));move=0});grab.addEventListener('click',start);document.getElementById('reset').addEventListener('click',refill);function dismiss(){overlay.classList.remove('show');msg.textContent='원하는 인형 위로 집게를 움직여 다시 도전해 보세요! 💛'}document.getElementById('again').addEventListener('click',dismiss);document.getElementById('cancel').addEventListener('click',dismiss);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){queuedX=null;move=-1}if(e.key==='ArrowRight'){queuedX=null;move=1}if(e.key===' '){e.preventDefault();start()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')move=0});refill();requestAnimationFrame(frame);
})();
</script></body></html>
